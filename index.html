<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Agenda de estudio con calendario mensual, notas ponderadas por asignatura y tareas pendientes."><title>Calendario</title>
<style>
*{box-sizing:border-box}html{background:#faf6ef;color:#433a3c;font:16px/1.45 "Avenir Next",system-ui,sans-serif}body{max-width:900px;margin:auto;padding:24px 20px 56px}nav{display:flex;justify-content:center;gap:3px;background:#f1e8e4;border-radius:28px;padding:5px;width:max-content;max-width:100%;margin:0 auto 40px}a{color:inherit;text-decoration:none}nav a,.btn,button{font:inherit;font-size:.9rem;border:0;padding:11px 16px;border-radius:22px;cursor:pointer;color:inherit}nav .active,.card{background:#fffdf9}nav .active{box-shadow:0 1px 5px #58404718}h1,h2,.num{font-family:Georgia,serif;font-weight:400}h1{font-size:clamp(2.5rem,7vw,4.4rem);letter-spacing:-.05em;margin:12px 0 24px;line-height:1.05}h2{font-size:1.6rem;margin:12px 0}button,.btn{background:#efdae0}.bar,.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.bar{flex-wrap:wrap;margin-bottom:12px}.bar h1{margin-bottom:10px}.card{border:1px solid #e4d9d3;border-radius:22px;padding:20px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}.dow{text-align:center;font-size:.77rem;color:#725e65;padding:9px 0}.day{min-height:76px;border-top:1px solid #eee5df;padding:8px;border-radius:4px}.day:hover,.subject:hover,.choice:hover{background:#faf0ef}.today .num{background:#754c5a;color:white;border-radius:50%}.num{display:inline-grid;place-items:center;font-size:1.15rem;width:28px;height:28px}.marks{display:flex;gap:3px;flex-wrap:wrap;margin:5px}.dot{display:inline-block;width:9px;height:9px;border-radius:100%;flex:none}.legend{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:#675961;margin:16px 2px}.legend span{display:flex;align-items:center;gap:5px}.back{display:inline-block;color:#795360;font-size:.9rem;padding:8px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.subject{min-height:81px;display:flex;align-items:center;justify-content:space-between;gap:8px}.ring{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;flex:none}.ring b{display:grid;place-items:center;background:#fffdf9;border-radius:50%;width:39px;height:39px;font-size:.85rem}.subname{display:flex;gap:9px;align-items:center}.lines{display:grid;gap:8px;margin:15px 0}.item{background:#fffdf9;border:1px solid #e4d9d3;border-radius:15px;padding:11px 14px}.muted,small{color:#76686a}.item strong,.item span{overflow-wrap:anywhere}.wheel{width:min(100%,350px);display:block;margin:8px auto 20px}.wheel a{cursor:pointer}.wheel text{font:600 7px system-ui;fill:#342c30;pointer-events:none;paint-order:stroke;stroke:#fff9;stroke-width:1.5}.choices{display:grid;grid-template-columns:1fr 1fr;gap:6px}.choice{padding:10px;display:flex;gap:6px;align-items:center;border-radius:12px}.sel{background:#f3e5e7;outline:1px solid #c3a0ac}form{display:grid;gap:12px}label{display:grid;gap:5px;font-size:.88rem}input,select{font:inherit;color:inherit;background:white;border:1px solid #d5c7c4;border-radius:10px;padding:10px;max-width:100%;min-width:0}input[type=color]{padding:3px;width:60px;height:43px}dialog{background:#fffaf6;color:inherit;border:1px solid #ddcfca;border-radius:23px;width:min(410px,92vw);max-height:86dvh;padding:24px}dialog::backdrop{background:#3e30365e}.task{flex:1;text-align:left;background:transparent;padding:8px 0;border-radius:3px;touch-action:manipulation;overflow-wrap:anywhere}.done{text-decoration:line-through;color:#94898b}.delete{background:transparent;font-size:1.2rem}.layout{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}.primary{background:#754c5a;color:white}.pair{display:flex;gap:5px}.navbtn{border:1px solid #dfcfd0;background:#fffaf6}.empty{margin:10px 0}.grade{font-size:1.15rem}.sr{position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden}@media(max-width:620px){body{padding:18px 12px 40px}nav{margin-bottom:26px}.card{padding:13px}.day{min-height:54px;padding:4px 0}.layout{grid-template-columns:1fr}.grid{gap:8px}.subject{padding:10px;min-height:86px}.subname{font-size:.87rem;gap:5px}.ring{width:37px;height:37px}.ring b{width:30px;height:30px;font-size:.75rem}nav a{padding:10px 12px}.bar h1{width:100%}.choice{font-size:.9rem}}
body{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;width:100%;padding-bottom:0}main{flex:1}footer{display:flex;align-items:center;justify-content:space-between;gap:16px;border-top:1px solid #e2d2d5;margin-top:44px;padding:18px 2px max(18px,env(safe-area-inset-bottom));color:#745c65;font-size:.82rem}footer em{margin-left:auto;font-family:Georgia,serif;font-size:1rem}.marker{width:10px;height:10px}.m0{background:#a23c62}.m1{background:transparent;border:2px solid #c0688b}.m3{background:#afa191}.m2{background:#efb6ca}.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.swatches button{min-height:44px;background:var(--shade);border:3px solid #fffaf6;outline:1px solid #dfd3d3}.swatches [aria-pressed=true]{outline:2px solid #684454}.previewColor{width:28px;height:28px;border:1px solid #0002;border-radius:50%}.colorButton{display:flex;align-items:center;gap:7px}
</style><body><nav id="nav" aria-label="Apartados"></nav><main id="main"></main><footer><em>Te quiero</em></footer><dialog id="dlg"></dialog><script>
const names=['Matemáticas','Lengua','Historia','Filosofía','Arte','Física','Inglés','Dibujo técnico'],types=['Examen','Proyecto','Entrega'],months=new Intl.DateTimeFormat('es',{month:'long'}),fmt=n=>String(n).padStart(2,'0'),key=d=>d.getFullYear()+'-'+fmt(d.getMonth()+1)+'-'+fmt(d.getDate()),now=new Date(),today=key(now),cap=s=>s.charAt(0).toUpperCase()+s.slice(1),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),url=(p,x={})=>'?'+new URLSearchParams({p,...x}),dot=c=>'<i class="dot" style="background:'+c+'"></i>';
const activityTypes=[...types,'Otros'];
function marker(i){return '<i aria-hidden="true" class="dot marker m'+i+'"></i>'}
let state={colors:['#cc889c','#d6af91','#d6bf78','#aa99c4','#d99786','#8eb6ae','#a2b9d0','#b4bc91'],order:names.map((_,i)=>i),events:[],grades:[],tasks:[]};
const storageKey='organizacion-maqueta-1';try{Object.assign(state,JSON.parse(localStorage.getItem(storageKey)))}catch{}
function save(){try{localStorage.setItem(storageKey,JSON.stringify(state))}catch{alert('El navegador no permite guardar los cambios en este dispositivo.')}render()}
const q=new URLSearchParams(location.search),p=q.get('p')||'calendario',id=Number(q.get('s')),valid=names[id]!==undefined,day=q.get('dia')||today,month=q.get('mes')||day.slice(0,7),base=new Date(month+'-01T12:00:00'),subLink=i=>url('asignatura',{s:i}),taskLink=i=>url('tareas',{s:i}),back=(link,title)=>'<a class="back" href="'+link+'">‹ '+title+'</a>',button=(label,fn)=>'<button class="primary" onclick="'+fn+'">'+label+'</button>',empty=t=>'<p class="empty muted">'+t+'</p>';
function average(i){const g=state.grades.filter(v=>v.s===i),w=g.reduce((a,v)=>a+v.weight,0);return w?g.reduce((a,v)=>a+v.weight*v.score,0)/w:null}
function ring(i){const n=average(i);return '<span class="ring" aria-label="Media '+(n===null?'sin notas':num(n))+'" style="background:conic-gradient('+state.colors[i]+' '+(n||0)*10+'%,#ece6e2 0)"><b>'+(n===null?'—':num(n))+'</b></span>'}
function num(n){return n.toLocaleString('es',{maximumFractionDigits:2})}
function calendar(){const y=base.getFullYear(),m=base.getMonth(),adj=k=>url('calendario',{mes:key(new Date(y,m+k,1)).slice(0,7)});let cells=['L','M','X','J','V','S','D'].map(v=>'<div class="dow">'+v+'</div>').join('')+'<div></div>'.repeat((base.getDay()+6)%7);for(let n=1;n<=new Date(y,m+1,0).getDate();n++){const d=key(new Date(y,m,n)),events=state.events.filter(e=>e.day===d);cells+='<a aria-label="'+d+', '+events.length+' actividades" class="day '+(d===today?'today':'')+'" href="'+url('dia',{dia:d})+'"><span class="num">'+n+'</span><span class="marks">'+activityTypes.map((_,i)=>events.some(e=>e.type===i)?marker(i):'').join('')+'</span></a>'}
return '<div class="bar"><h1>'+cap(months.format(base))+' <em style="color:#956e79;font-weight:normal">'+y+'</em></h1><div class="pair"><a class="btn navbtn" aria-label="Mes anterior" href="'+adj(-1)+'">‹</a><a class="btn navbtn" href="'+url('dia',{dia:today})+'">Hoy</a><a class="btn navbtn" aria-label="Mes siguiente" href="'+adj(1)+'">›</a></div></div><div class="card calendar">'+cells+'</div><div class="legend">'+['Exámenes','Proyectos','Entregas','Otros'].map((t,i)=>'<span>'+marker(i)+t+'</span>').join('')+'</div>'}
function dayView(){
 const rows=state.events.map((activity,index)=>{
   if(activity.day!==day)return '';
   const title=esc(activity.title);
   const details=esc(activity.customType||activityTypes[activity.type])+' · '+names[activity.s];
   return '<div class="item row"><div>'+marker(activity.type)+' <strong>'+title+'</strong><br><small>'+details+'</small></div><button type="button" class="delete" aria-label="Eliminar actividad: '+title+'" onclick="confirmActivityRemoval('+index+')">×</button></div>';
 }).join('');
 const heading=cap(new Date(day+'T12:00').toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'}));
 return back(url('calendario',{mes:month}),'Calendario')+'<h1>'+heading+'</h1>'+button('Añadir actividad',"openForm('event')")+'<div class="lines">'+(rows||empty('Todavía no hay actividades este día.'))+'</div>';
}
function confirmActivityRemoval(index){
 const activity=state.events[index];
 if(!activity||activity.day!==day)return;
 modal('¿Eliminar esta actividad?','<p>'+esc(activity.title)+'</p>',()=>{
   state.events=state.events.filter(entry=>entry!==activity);
 },'Eliminar');
}
function subjects(){return '<h1>Asignaturas</h1><div class="grid">'+names.map((n,i)=>'<a class="card subject" href="'+subLink(i)+'"><span class="subname">'+dot(state.colors[i])+n+'</span>'+ring(i)+'</a>').join('')+'</div>'}
function subject(){const g=state.grades.filter(v=>v.s===id);return back(url('asignaturas'),'Asignaturas')+'<h1>'+names[id]+'</h1><div class="card row"><div><small>Media ponderada</small><div class="grade">'+(average(id)===null?'Sin calificar':num(average(id))+' / 10')+'</div><small>'+num(g.reduce((a,v)=>a+v.weight,0))+' % evaluado</small></div><button class="colorButton" onclick="colorForm()">'+dot(state.colors[id])+' Cambiar color</button></div><div class="bar"><h2>Calificaciones</h2>'+button('Añadir nota',"openForm('grade')")+'</div><div class="lines">'+(g.map(v=>'<div class="item row"><span>'+esc(v.label)+' · '+num(v.weight)+' %</span><strong>'+num(v.score)+'/10</strong></div>').join('')||empty('Aquí aparecerán tus notas.'))+'</div>'}
const pending=i=>state.tasks.filter(t=>t.s===i&&!t.done).length;
function wheel(){let slices='';state.order.forEach((i,k)=>{const a=(k*45-112.5)*Math.PI/180,b=a+Math.PI/4,pt=(angle,r)=>[100+r*Math.cos(angle),100+r*Math.sin(angle)],xy=pt((a+b)/2,67),all=state.tasks.some(t=>t.s===i)&&!pending(i);slices+='<a href="'+taskLink(i)+'" aria-label="'+names[i]+' ('+pending(i)+')"><path d="M100 100 L'+pt(a,96)+' A96 96 0 0 1 '+pt(b,96)+' Z" fill="'+state.colors[i]+'" fill-opacity="'+(all?1:.48)+'" stroke="#fffaf6" stroke-width="1.3"/><text x="'+xy[0]+'" y="'+xy[1]+'" text-anchor="middle" dominant-baseline="middle">'+(i===7?'D. técnico':names[i])+' ('+pending(i)+')</text></a>'});return '<svg class="wheel" viewBox="0 0 200 200" aria-label="Rueda de asignaturas">'+slices+'</svg>'}
function tasks(){const selected=q.has('s')&&valid,list=state.tasks.filter(t=>t.s===id);return '<div class="bar"><h1>Tareas</h1><button onclick="orderForm()">Ordenar porciones</button></div><div class="layout"><div class="card">'+wheel()+'<div class="choices">'+state.order.map(i=>'<a class="choice '+(selected&&id===i?'sel':'')+'" href="'+taskLink(i)+'">'+dot(state.colors[i])+names[i]+' ('+pending(i)+')</a>').join('')+'</div></div><section class="card">'+(selected?'<div class="bar"><h2>'+names[id]+'</h2>'+button('Añadir tarea',"openForm('task')")+'</div>'+(list.length?'<small>Toca dos veces una tarea para marcarla o desmarcarla.</small>':empty('Todavía no hay tareas.'))+'<div class="lines">'+list.map(t=>'<div class="item row"><button class="task '+(t.done?'done':'')+'" aria-pressed="'+t.done+'" onclick="tap(event,'+t.id+')">'+esc(t.title)+'</button><button class="delete" aria-label="Eliminar tarea" onclick="removeForm('+t.id+')">×</button></div>').join('')+'</div>':'<h2>Tareas por asignatura</h2>'+empty('Toca una porción para ver sus tareas.'))+'</section></div>'}
let lastTap={};function tap(e,i){if(e.detail===0||(lastTap.i===i&&Date.now()-lastTap.at<500)){const t=state.tasks.find(t=>t.id===i);t.done=!t.done;lastTap={};save()}else lastTap={i,at:Date.now()}}
function modal(title,body,action,label){dlg.innerHTML='<form><h2>'+title+'</h2>'+body+'<div class="bar"><button type="button" onclick="dlg.close()">Cancelar</button><button class="primary">'+label+'</button></div></form>';dlg.querySelector('form').onsubmit=e=>{e.preventDefault();if(action(new FormData(e.target))===false)return;dlg.close();save()};dlg.showModal()}
const opts=arr=>arr.map((v,i)=>'<option value="'+i+'">'+v+'</option>').join(''),titleField='<label>Descripción<input name="title" required maxlength="180" pattern=".*\\S.*"></label>';
function openForm(kind){if(kind==='task'){modal('Nueva tarea',titleField,f=>state.tasks.push({s:id,title:f.get('title').trim(),id:state.tasks.reduce((a,t)=>Math.max(a,t.id),0)+1,done:false}),'Añadir tarea');return}
if(kind==='event'){
 const fields=titleField+'<label>Tipo<select name="type">'+opts(activityTypes)+'</select></label><div hidden><label>¿Qué tipo de actividad es?<input name="customType" disabled maxlength="80" pattern=".*[^ ].*" placeholder="Por ejemplo, práctica de laboratorio"></label></div><label>Asignatura<select name="s">'+opts(names)+'</select></label>';
 modal('Nueva actividad',fields,f=>{
   const type=Number(f.get('type'));
   const customType=type===3?f.get('customType').trim():'';
   state.events.push({title:f.get('title').trim(),day,type,customType,s:Number(f.get('s'))});
 },'Guardar actividad');
 const {type,customType}=dlg.querySelector('form').elements;
 type.onchange=()=>{
   const other=type.value==='3';
   customType.closest('div').hidden=!other;
   customType.disabled=!other;
   customType.required=other;
 };
 return
}
const remain=Number((100-state.grades.filter(g=>g.s===id).reduce((a,g)=>a+g.weight,0)).toFixed(2));if(remain<=0){alert('Ya has asignado el 100 % de la nota.');return}
modal('Nueva calificación','<label>Tipo<select name="type" onchange="const o=this.form.elements.other;o.parentElement.hidden=this.value!==\'3\';o.required=this.value===\'3\'">'+opts([...types,'Otros'])+'</select></label><div hidden><label for="other">¿Qué has evaluado?</label><input id="other" name="other" maxlength="120"></div><label>Nota sobre 10<input name="score" type="number" inputmode="decimal" min="0" max="10" step="0.01" required></label><label>Peso en la media (%)<input name="weight" type="number" inputmode="decimal" min="0.01" max="'+remain+'" step="0.01" required></label>',f=>state.grades.push({s:id,label:types[+f.get('type')]||f.get('other'),score:+f.get('score'),weight:+f.get('weight')}),'Guardar nota')}
function colorForm(){
 const shades=['#cc889c','#eeb9ce','#bd627e','#d6af91','#d6bf78','#aa99c4','#8eb6ae','#a2b9d0','#b4bc91','#d99786','#826991','#688898'];
 const buttons=shades.map(c=>'<button type="button" aria-label="Color '+c+'" data-color="'+c+'" style="--shade:'+c+'"></button>').join('');
 modal('Color de '+names[id],'<div class="swatches">'+buttons+'</div><label>Color personalizado (HEX)<input name="hex" value="'+state.colors[id]+'" pattern="#?[a-fA-F0-9]{6}" required maxlength="7" autocapitalize="off" spellcheck="false"></label><div class="row"><small>Vista previa</small><i class="previewColor"></i></div>',f=>{state.colors[id]='#'+f.get('hex').replace('#','').toLowerCase()},'Guardar color');
 const field=dlg.querySelector('[name=hex]');
 function preview(){const color='#'+field.value.replace('#','').toLowerCase();dlg.querySelector('.previewColor').style.background=field.validity.valid?color:'transparent';dlg.querySelectorAll('[data-color]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.color===color))}
 dlg.querySelector('.swatches').onclick=e=>{if(e.target.dataset.color){field.value=e.target.dataset.color;preview()}};
 field.oninput=preview;preview()
}
function orderForm(){let draft=[...state.order];modal('Ordenar porciones','<small>La primera porción queda arriba. Las demás siguen el sentido de las agujas del reloj.</small><div id="ordering"></div>',()=>{state.order=draft},'Guardar orden');function draw(){ordering.innerHTML=draft.map((s,i)=>'<div class="row"><span>'+dot(state.colors[s])+' '+names[s]+'</span><div>'+[-1,1].map(d=>'<button type="button" aria-label="'+(d<0?'Subir ':'Bajar ')+names[s]+'" data-i="'+i+'" data-d="'+d+'" '+(i+d<0||i+d>7?'disabled':'')+'>'+(d<0?'↑':'↓')+'</button>').join('')+'</div></div>').join('')}draw();ordering.onclick=e=>{if(!e.target.matches('button'))return;const i=+e.target.dataset.i,j=i+(+e.target.dataset.d);[draft[i],draft[j]]=[draft[j],draft[i]];draw()}}
function removeForm(i){modal('¿Eliminar esta tarea?','<p>'+esc(state.tasks.find(t=>t.id===i).title)+'</p>',()=>{state.tasks=state.tasks.filter(t=>t.id!==i)},'Eliminar')}
function render(){const section=p==='dia'?'calendario':p==='asignatura'?'asignaturas':p;nav.innerHTML=['Calendario','Asignaturas','Tareas'].map(n=>'<a class="'+(section===n.toLowerCase()?'active':'')+'" href="'+url(n.toLowerCase())+'">'+n+'</a>').join('');main.innerHTML=p==='dia'?dayView():p==='asignaturas'?subjects():p==='asignatura'&&valid?subject():p==='tareas'?tasks():calendar();document.title=main.querySelector('h1').textContent}
window.addEventListener("pageshow",()=>{try{Object.assign(state,JSON.parse(localStorage.getItem(storageKey)))}catch{}render()});render();
</script></body></html>
